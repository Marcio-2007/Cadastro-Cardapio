<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/form.css">
   
    <title>Cadastro</title>
</head>
<body>
    <dialog id="modal">
        <div id="warn">

        </div>
    </dialog>
    <form id="form-curriculo">

        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf">

        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="date" name="nascimento">

        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo">
            <option value="">Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
        </select>

        <label for="estado-civil">Estado Civil</label>
        <select id="estado-civil" name="estado-civil">
            <option value="">Selecione</option>
            <option value="solteiro">Solteiro</option>
            <option value="casado">Casado</option>
            <option value="divorciado">Divorciado</option>
            <option value="viuvo">Viúvo</option>
        </select>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">

        <label for="rua">Rua</label>
        <input placeholder="Opcional" type="text" id="rua" name="rua">

        <label for="numero">Número</label>
        <input placeholder="Opcional" type="number" id="numero" name="numero">

        <label for="bairro">Bairro</label>
        <input placeholder="Opcional"  type="text" id="bairro" name="bairro">

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade">

        <label for="uf">UF</label>
        <select id="uf" name="uf">
            <option value="">Selecione</option>
            <option value="MA">MA</option>
            <option value="PI">PI</option>
            <option value="CE">CE</option>
            <option value="PE">PE</option>
            <option value="BA">BA</option>
            <option value="MG">MG</option>
            <option value="RJ">RJ</option>
            <option value="SP">SP</option>
        </select>

        <label for="escolaridade">Escolaridade</label>
        <select id="escolaridade" name="escolaridade">
            <option value="">Selecione</option>
            <option value="fundamental">Ensino Fundamental</option>
            <option value="medio">Ensino Médio</option>
            <option value="superior">Ensino Superior</option>
            <option value="pos">Pós-graduação</option>
        </select>

        <label for="curso">Curso</label>
        <input placeholder="Opcional"  type="text" id="curso" name="curso">

        <label for="empresa">Empresa</label>
        <input placeholder="Opcional"  type="text" id="empresa" name="empresa">

        <label for="cargo">Cargo</label>
        <input placeholder="Opcional"  type="text" id="cargo" name="cargo">

        <label for="experiencia">Tempo de Experiência</label>
        <input type="number" id="experiencia" name="experiencia">

        <label for="objetivo">Objetivo Profissional</label>
        <textarea id="objetivo" name="objetivo"></textarea>

        <label for="observacoes">Observações</label>
        <textarea placeholder="Opcional"  id="observacoes" name="observacoes"></textarea>

        <button  id="submit">Enviar</button>

    </form>
    
    <script src="./js/validacao.js"></script>
</body>
</html>
