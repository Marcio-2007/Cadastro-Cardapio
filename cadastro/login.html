<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <dialog id="janela">
        <div id="info"></div>   
    </dialog>
    <main id="esq">
        <header>
            <div id="title">
                <p>Login</p>
            </div>
        </header>

        <form>
          
            <img class="img" src="img/profile.png" alt="logo">
            <input type="text" class="campo" name="nome" placeholder="Nome" required/>

            <img class="img" src="img/lock.png" alt="logo">
            <input type="password" class="campo" name="senha" placeholder="Senha" minlength="4" required/>

            <div id="botao">
                <button>Entrar</button>
            </div>

        </form>

        <div id="link">
            <a href="redef.html" target="_self">Redefinir Cadastro?</a>
        </div>
    </main>

    <aside id="background">
    </aside>

    <div id="logo">
        <img src="img/logo.png" alt="logo">
    </div>

    <script src="js/validlogin.js"></script>
</body>
</html>
