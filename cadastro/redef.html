<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir cadastro</title>
    <link rel="stylesheet" href="css/redef.css">
</head>
<body>
    <dialog>
        <div>
            
        </div>
    </dialog>
    <main id="esq">
        <header>
            <h1>Redefinir Cadastro</h1>
            <p>Para redefinir seu cadastro, insira seu nome e senha do cadastro atual. Após isso, siga com as novas credênciais.</p>
        </header>

        <form>

            <div class="linha">

                <div class="cola">
                    <label for="nome">Nome de perfíl atual:</label>
                    <div id="campo1">
                        <img class="img" src="img/profile.png" alt="logo">
                        <input type="text" id="nome" name="nome" placeholder="Nome" required/>
                    </div>
                </div>


                <div class="cola">
                    <label for="senha">Senha atual:</label>
                    <div id="campo2">
                        <img class="img" src="img/lock.png" alt="logo">
                        <input type="password" id="senha" name="senha" placeholder="Senha" minlength="4" required/>
                    </div> 
                </div>
            </div>

            <div class="linha">
                
                <div class="cola">
                    <label for="nome_novo">Novo nome de perfíl:</label>
                    <div id="campo3">
                        <img class="img" src="img/profile.png" alt="logo">
                        <input type="text" id="nomovo" name="nome_novo" placeholder="Nome" required/>
                    </div>
                </div>


                <div class="cola">
                    <label for="senha_nova">Nova senha:</label>
                    <div id="campo4">
                        <img class="img" src="img/lock.png" alt="logo">
                        <input type="password" id="senova" name="senha_nova" placeholder="Senha" required/>
                    </div> 
                </div>
            </div>


        <button id="submit">Confirmar</button>
        </form>
        
        <a href="login.html" target="_self">Voltar?</a>
    </main>

    <aside id="background">
    </aside>

    <div id="logo">
        <img src="img/logo.png" alt="logo">
    </div>
      
</body>
</html>
