<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cdt.css">
</head>
<body>
    <dialog id="janela">
        <div id="info"></div>   
    </dialog>
    <main id="esq">
        <header>
            <h1>Cadastro</h1>
            <p>Essa etapa é necesária uma única vez,<br> a menos que você deseje redefinir sua senha e nome de perfil.</p>
        </header>

        <form>

            <label for="nome">Crie um nome de perfíl:</label>
            <div id="campo1">
                <img class="img" src="img/profile.png" alt="logo">
                <input type="text" id="nome" name="nome" placeholder="Nome" required/>
            </div>


            <label for="senha">Crie uma senha:</label>
            <div id="campo2">
                <img class="img" src="img/lock.png" alt="logo">
                <input type="password" id="senha" name="senha" placeholder="Senha" minlength="4" required/>
            </div> 


        <button id="submit">Confirmar</button>

        </form>
    </main>

    <aside id="background">
    </aside>

    <div id="logo">
        <img src="img/logo.png" alt="logo">
    </div>
    <script src="js/validcdt.js"></script>
</body>
</html>
