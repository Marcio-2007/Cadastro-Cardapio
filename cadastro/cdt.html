<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cdt.css">
</head>
<body>
    <dialog id="janela">
        <div id="info"></div>   
    </dialog>
    <main id="esq">
        <header>
            <div id="title">
                <p>Cadastro</p>
            </div>
            <div id="exp">
                <p>Essa etapa é necesária uma única vez,<br> a menos que você deseje redefinir sua senha e nome de perfil.</p>
            </div>
        </header>

        <form>

            <img class="img" src="img/profile.png" alt="logo">
            <label for="nome">Crie um nome de perfíl:</label>   
            <input type="text" class="campo" name="nome" placeholder="Nome" required/>
            
            <img class="img" src="img/lock.png" alt="logo">
            <label for="senha">Crie uma senha:</label>
            <input type="password" class="campo" name="senha" placeholder="Senha" minlength="4" required/>
            
            <div id="botao">
                <button>Confirmar</button>
            </div>
            
        </form>
    </main>

    <aside id="background">
    </aside>

    <div id="logo">
        <img src="img/logo.png" alt="logo">
    </div>

    <script src="js/validcdt.js"></script>
</body>
</html>
